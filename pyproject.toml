[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saffron-sae"
version = "0.1.0"
description = "SAFFRON: a Sparse Autoencoder Framework For Representing Omics Natural variation — a mechanistic interpretability framework for spatial foundation model embeddings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "anndata>=0.9",
    "matplotlib>=3.5",
    "jupyter",
    "ipykernel",
]

[project.optional-dependencies]
docs = [
    "sphinx>=5.3",
    "sphinx_rtd_theme",
    "sphinx_copybutton>=0.5.0",
    "nbsphinx>=0.9",
    "ipython",
]

[project.urls]
"Homepage" = "https://github.com/chitra-lab/SAFFRON"

[tool.setuptools.packages.find]
include = ["saffron*"]
